<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 安全攻防演练场 · AI Security Range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="training-pipeline.css">
</head>
<body>
  <div id="app">
    <!-- 左侧抽屉式可收缩侧边导航 -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-brand">
        <span class="sb-mark serif">AI</span>
        <div class="sb-brand-text">
          <span class="sb-brand-name serif">AI 安全攻防演练场</span>
          <span class="sb-brand-sub">AI Security Range</span>
        </div>
      </div>
      <nav class="sb-nav" id="sidenav">
        <a href="#/tasks" data-route="tasks">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="1.5" width="5.5" height="5.5"/><rect x="9" y="1.5" width="5.5" height="5.5"/><rect x="1.5" y="9" width="5.5" height="5.5"/><rect x="9" y="9" width="5.5" height="5.5"/></svg>
          <span class="sb-label">任务中心</span><span class="run-dot" id="run-dot" style="display:none"></span>
          <span class="sb-tip">任务中心</span>
        </a>
        <a href="#/training" data-route="training">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 4.5h4.2M2 8h7.4M2 11.5H14"/><circle cx="11.5" cy="4.5" r="2.2"/><circle cx="11.5" cy="8" r="2.2"/><circle cx="11.5" cy="11.5" r="2.2"/></svg>
          <span class="sb-label">训练任务</span>
          <span class="sb-tip">训练任务</span>
        </a>
        <a href="#/range" data-route="range">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.6"/><path d="M8 1v2.4M8 12.6V15M1 8h2.4M12.6 8H15"/></svg>
          <span class="sb-label">靶场控制台</span>
          <span class="sb-tip">靶场控制台</span>
        </a>
        <a href="#/data" data-route="data">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="8" cy="3.5" rx="6" ry="2.5"/><path d="M2 3.5v9c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-9"/><path d="M2 8c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5"/></svg>
          <span class="sb-label">数据中心</span>
          <span class="sb-tip">数据中心</span>
        </a>
        <a href="#/resources" data-route="resources">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="12" height="5"/><rect x="2" y="9" width="12" height="5"/><circle cx="4.6" cy="4.5" r=".9" fill="currentColor" stroke="none"/><circle cx="4.6" cy="11.5" r=".9" fill="currentColor" stroke="none"/></svg>
          <span class="sb-label">资源中心</span>
          <span class="sb-tip">资源中心</span>
        </a>
      </nav>
      <div class="sb-spacer"></div>
      <button class="sb-collapse" id="sb-collapse" title="收起导航">« <span class="sb-label">收起导航</span></button>
      <div class="sb-foot">
        <button class="btn btn-ghost sb-theme" id="theme-toggle" title="切换深/浅主题" aria-label="切换主题">
          <span id="theme-icon">◐</span>
        </button>
        <!-- 用户中心（示意：角色切换仅本地持久化，无权限控制） -->
        <div class="user-center" id="user-center">
          <button class="btn btn-ghost uc-btn" id="user-center-btn" aria-haspopup="true" aria-expanded="false" title="用户中心">
            <span class="uc-avatar">OP</span>
            <span class="uc-name">operator</span>
            <span class="badge" id="uc-role-badge">operator</span>
          </button>
          <div class="uc-pop" id="user-pop" hidden>
            <div class="uc-pop-head">
              <span class="uc-avatar uc-avatar-lg">OP</span>
              <div class="uc-pop-id">
                <strong>operator</strong>
                <span class="muted small">当前角色：<span id="uc-pop-role">操作员</span></span>
              </div>
            </div>
            <div class="uc-pop-sep"></div>
            <div id="uc-roles">
              <button class="uc-role-item" data-role="admin">
                <span class="uc-role-main"><b>admin · 管理员</b><small class="muted">全部配置与数据权限</small></span>
                <span class="uc-check">✓</span>
              </button>
              <button class="uc-role-item" data-role="operator">
                <span class="uc-role-main"><b>operator · 操作员</b><small class="muted">任务创建与执行</small></span>
                <span class="uc-check">✓</span>
              </button>
              <button class="uc-role-item" data-role="viewer">
                <span class="uc-role-main"><b>viewer · 观察员</b><small class="muted">只读查看结果</small></span>
                <span class="uc-check">✓</span>
              </button>
            </div>
            <div class="uc-pop-sep"></div>
            <button class="btn btn-ghost uc-settings" id="uc-settings">设置</button>
            <p class="uc-settings-note muted" id="uc-settings-note" hidden>设置项待配置</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- 各视图由 app.js 渲染 -->
    <main id="view"></main>
  </div>

  <!-- 弹窗挂载点 -->
  <div id="modal-root"></div>

  <script src="data.js"></script>
  <script src="training-pipeline.js"></script>
  <script src="app.js"></script>
</body>
</html>
