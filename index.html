<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBERSEC RANGE 网安攻防演练场</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css?v=412">
<link rel="stylesheet" href="styles.css?v=412">
</head>
<body>
  <div id="app">
    <!-- 角色独立产品空间：导航由 app.js 按当前演示身份生成 -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-brand">
        <span class="sb-mark serif">CR</span>
        <div class="sb-brand-text">
          <span class="sb-brand-name serif">网安攻防演练场</span>
          <span class="sb-brand-sub" id="sb-space-name">研究员空间 · 930</span>
        </div>
      </div>
      <nav class="sb-nav" id="sidenav" aria-label="当前产品空间导航"></nav>
      <div class="sb-spacer"></div>
      <button class="sb-collapse" id="sb-collapse" title="收起导航">« <span class="sb-label">收起导航</span></button>
      <div class="sb-foot">
        <button class="btn btn-ghost sb-theme" id="theme-toggle" title="切换深/浅主题" aria-label="切换主题">
          <span id="theme-icon">◑</span>
        </button>
        <div class="user-center" id="user-center">
          <button class="btn btn-ghost uc-btn" id="user-center-btn" aria-haspopup="true" aria-expanded="false" title="用户与演示身份">
            <span class="uc-avatar" id="uc-avatar">研</span>
            <span class="uc-name"><b id="uc-name">实验室研究员</b><small id="uc-space">研究员空间</small></span>
          </button>
          <div class="uc-pop" id="user-pop" hidden>
            <div class="uc-pop-head">
              <span class="uc-avatar uc-avatar-lg" id="uc-pop-avatar">研</span>
              <div class="uc-pop-id">
                <strong id="uc-pop-name">实验室研究员</strong>
                <span class="muted small" id="uc-pop-space">研究员空间 · SSO 已登录</span>
              </div>
            </div>
            <div class="uc-pop-sep"></div>
            <div class="uc-pop-label">切换演示身份</div>
            <button class="uc-role-item" data-demo-role="training">
              <span class="uc-role-main"><b>实验室研究员</b><small class="muted">训练任务与模型结果</small></span><span class="uc-check">✓</span>
            </button>
            <button class="uc-role-item" data-demo-role="regulatory">
              <span class="uc-role-main"><b>监管评测人员</b><small class="muted">评测任务与可信报告</small></span><span class="uc-check">✓</span>
            </button>
            <button class="uc-role-item" data-demo-role="enterprise">
              <span class="uc-role-main"><b>开发者与企业用户</b><small class="muted">数据集与生产管线</small></span><span class="uc-check">✓</span>
            </button>
            <div class="uc-pop-sep"></div>
            <button class="uc-role-item" id="uc-profile">
              <span class="uc-role-main"><b>个人中心</b><small class="muted">资料 / 安全设置 / 我的 API 密钥</small></span>
            </button>
            <button class="uc-role-item" id="uc-logout">
              <span class="uc-role-main"><b>退出登录</b><small class="muted">返回 SSO 登录页</small></span>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <main id="view"></main>
  </div>

  <div id="modal-root"></div>

  <script src="data.js?v=412"></script>
  <script src="app.js?v=412"></script>
</body>
</html>
